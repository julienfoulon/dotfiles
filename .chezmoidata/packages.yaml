packages:
  linux:
    arch:
      pacman:
        - zsh               # used instead of bash
        - zsh-completions
        - sudo
        - zip
        - unzip
        - zlib
        - bzip2
        - p7zip
        - wget
        - xdg-user-dirs
        - xdg-utils
        - less              # used by git
        - zoxide            # better cd
        - eza               # better ls
        - fzf               # a fuzzy finder
        - fd                # a better find
        - bat               # better cat
        - jq                # JSON parsing for scripts
        - rsync             # efficient file sync over ssh
        - git               # plugins and dev
        - jujutsu           # jj VCS
        - base-devel        # for yay install
        - openssh           # include ssh-agent and ssh-add
        - neovim            # better vi
        - tree-sitter-cli   # parser installer for nvim-treesitter
        - zellij            # multiplexer
        - age               # encryption
        - ripgrep           # better grep
        - figlet            # login banner art
        - fnm               # node version manager (replaces zsh-nvm)
      yay:
        #- fbterm            # Framebuffer terminal
    ubuntu:
      apt:
        - zsh
        - zsh-common        # includes completions on Ubuntu
        - sudo
        - zip
        - unzip
        - zlib1g            # zlib runtime
        - bzip2
        - p7zip-full
        - wget
        - software-properties-common
        - xdg-user-dirs
        - xdg-utils
        - less
        - fd-find           # binary is fdfind
        - bat               # binary is batcat
        - jq
        - git
        - build-essential   # Arch base-devel equivalent
        - pkg-config        # cargo build dep (openssl-sys etc.)
        - libssl-dev        # cargo build dep (openssl-sys etc.)
        - openssh-client
        - age
        - figlet            # login banner art
        - systemd-container  # systemd-nspawn for nested nspawn dev
      cargo:
        - eza
        - zoxide
        - zellij
        - ripgrep
        - cargo-update
        - jj-cli            # jj VCS
        - fnm               # node version manager (replaces zsh-nvm)
