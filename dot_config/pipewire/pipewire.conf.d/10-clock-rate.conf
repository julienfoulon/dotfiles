# Allow PipeWire to follow the source sample rate instead of pinning 48 kHz.
# Rates match what the Aiyima A80 (Pawpaw USB HIFI Audio) advertises to ALSA.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 ]
}
